apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
  labels:
    app: mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-server
  template:
    metadata:
      labels:
        app: mcp-server
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "mcp-server"
        dapr.io/app-port: "8003" # Adjust to actual port of MCP server
    spec:
      containers:
      - name: mcp-server
        image: mcp-server:latest # Will be replaced by CI/CD
        ports:
        - containerPort: 8003
