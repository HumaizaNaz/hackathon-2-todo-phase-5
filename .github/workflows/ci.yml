name: CI Build and Push Docker Images

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  DOCKER_REGISTRY: docker.io
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
  
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ env.DOCKER_USERNAME }}
        password: ${{ env.DOCKER_PASSWORD }}

    - name: Build and push backend image
      id: build-backend
      uses: docker/build-push-action@v4
      with:
        context: ./backend
        push: true
        tags: ${{ env.DOCKER_USERNAME }}/backend:latest

    - name: Build and push frontend image
      id: build-frontend
      uses: docker/build-push-action@v4
      with:
        context: ./frontend
        push: true
        tags: ${{ env.DOCKER_USERNAME }}/frontend:latest

    - name: Build and push mcp-server image
      id: build-mcp-server
      uses: docker/build-push-action@v4
      with:
        context: ./mcp-server
        push: true
        tags: ${{ env.DOCKER_USERNAME }}/mcp-server:latest

    - name: Build and push ai-agent image
      id: build-ai-agent
      uses: docker/build-push-action@v4
      with:
        context: ./ai-agent
        push: true
        tags: ${{ env.DOCKER_USERNAME }}/ai-agent:latest
